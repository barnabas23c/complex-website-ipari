<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./kapcsolat/style.css">
    <script defer src="./kapcsolat/index.js"></script>
</head>
<body>
    <!--Navbar-->
    <nav class="navbar navbar-expand-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="./media/logo.png" alt="Valve logó" height="50" id="valve_logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a href="/" class="nav-link" title="Ugrás a főoldalra"><u>Főoldal</u></a>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <form method="get" action="./bekuldott">
            <h1>Kapcsolat</h1>
            <label for="nev">Név</label><br>
            <input type="text" name="nev" id="nev" placeholder="Nagy János" required><br>
            <label for="email">Email</label><br>
            <input type="email" name="email" id="email" placeholder="nagy.janos.420@freemail.com" required><br>
            <label for="telefonszam">Telefonszám</label><br>
            <input type="tel" name="telefonszam" id="telefonszam" placeholder="+36 30 123 4567" required><br>
            <label for="opcio">Mivel kapcsolatban?</label><br>
            <select name="opcio" id="opcio" required>
                <option value="munka">Munka</option>
                <option value="problema">Probléma bejelentés</option>
                <option value="egyeb">Egyéb</option>
            </select><br>
            <label for="uzenet">Üzenet</label><br>
            <textarea name="uzenet" id="uzenet" placeholder="Írj egy üzenetet..." required></textarea><br>
            <div class="center">
                <button type="submit">Küldés</button>
            </div>
        </form>
    </main>
    </body>
    </html>
